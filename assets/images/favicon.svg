  </defs>
  <!-- Rounded Square Card Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#favGrad)" stroke-width="2.5" />
  <!-- Monogram Text AS -->
  <text x="32" y="41" font-family="'Fraunces', 'Cormorant Garamond', Georgia, serif" font-size="26" font-weight="700" fill="#fdf8f6" text-anchor="middle" letter-spacing="-1">AS</text>
